# 更新镜像：docker compose pull && docker compose up -d

services:
  reader:
    image: ${DOCKERHUB_USER}/reader:latest
    container_name: reader
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      # 右侧 8080 是容器内固定端口，不要改
      - "8096:8080"

    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      SPRING_PROFILES_ACTIVE: prod

      READER_APP_STORAGEPATH: /storage
      LOGGING_PATH: /logs

      # JVM：按容器内存上限分配堆，剩 25% 留给堆外
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+ExitOnOutOfMemoryError

      READER_APP_USERLIMIT: 10
      READER_APP_USERBOOKLIMIT: 1000
      READER_APP_CACHECHAPTERCONTENT: "true"
      READER_APP_REMOTEWEBVIEWAPI: http://readerwebview:8050

      # 鉴权：上游默认 secure=false（完全无鉴权），必须显式开启
      READER_APP_SECURE: "true"
      READER_APP_SECUREKEY: adminpwd
      READER_APP_INVITECODE: registercode

    volumes:
      - /share/Container/reader/logs:/logs
      - /share/Container/reader/storage:/storage

    # /health 为应用内免鉴权端点；start_period 覆盖 Spring Boot 冷启动
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - MKNOD

  # webview 书源容器。hectorqin/remote-webview 已随官方删库，若拉取失败，
  # 把本服务与 reader 的 READER_APP_REMOTEWEBVIEWAPI 一起注释掉
  readerwebview:
    image: hectorqin/remote-webview
    container_name: readerwebview
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
