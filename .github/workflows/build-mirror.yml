name: Build & Push Multi-Arch Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "语义化版本号（留空则自动从 cli.gradle 读取）"
        required: false
        default: ""
      push_image:
        description: "是否推送到 Docker Hub"
        required: false
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号来源优先级：手动输入 > git tag > cli.gradle 里的 version
      - name: Resolve semantic version
        id: ver
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$V" ]; then
            V="$(grep -m1 -oP "(?<=^version = ')[^']+" cli.gradle || true)"
          fi
          if [ -z "$V" ]; then V="0.0.0"; fi
          echo "version=${V}"                 >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}"                 >> "$GITHUB_OUTPUT"
          echo "major=${V%%.*}"                >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "resolved version -> ${V}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event.inputs.push_image != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/reader
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=${{ steps.ver.outputs.major }}
            type=raw,value=sha-${{ steps.ver.outputs.sha }}
          labels: |
            org.opencontainers.image.title=reader
            org.opencontainers.image.description=Mirror of changshengyu/reader-dev (阅读3 server), Kotlin + Spring Boot + Vert.x
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # 推送开关：手动运行时可只构建不推送（用于验证 Dockerfile）
          push: ${{ github.event.inputs.push_image != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image summary
        run: |
          echo "### 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本: ${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 平台: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "- 摘要: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
