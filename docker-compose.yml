services:
  reader:
    image: hamily/reader:latest
    container_name: reader  #容器名
    restart: always
    stop_grace_period: 30s # 关容器时给 JVM 30 秒优雅停机，避免写数据时被强杀
    ports:
      - 8096:8080 # 冒号左侧端口映射可自行修改，右侧 8080 不要改
    volumes:
      - /share/Container/reader/logs:/logs  # log映射目录可自行修改
      - /share/Container/reader/storage:/storage # 数据映射目录可自行修改
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - READER_APP_STORAGEPATH=/storage  # 必须显式指定，否则数据会落到容器内 /app 而非挂载卷
      - LOGGING_PATH=/logs
      # 末尾 4 个 -D 是 JVM 全局代理：走代理后 DNS 由代理解析，可绕过域名污染
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Dhttp.proxyHost=192.168.31.2 -Dhttp.proxyPort=7890 -Dhttps.proxyHost=192.168.31.2 -Dhttps.proxyPort=7890
      - READER_APP_USERLIMIT=10  # 用户上限,默认且最大值为50
      - READER_APP_USERBOOKLIMIT=1000  # 用户书籍上限,默认200
      - READER_APP_CACHECHAPTERCONTENT=true # 开启缓存章节内容
      - READER_APP_REMOTEWEBVIEWAPI=http://readerwebview:8050 #启用webview(若下方readerwebview容器不开启需注释此行
      # ↓多用户模式配置↓
      - READER_APP_SECURE=true #开启登录鉴权，开启后将支持多用户模式
      - READER_APP_SECUREKEY=adminpwd  #管理员密码  建议修改
      - READER_APP_INVITECODE=registercode #注册邀请码 建议修改,如不需要可注释或删除
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 如需支持webview书源，打开(占用较大，不需要可加 # 注释或直接删掉)
  # 注意：hectorqin/remote-webview 已随官方删库，若拉取失败，
  # 把本服务与上方的 READER_APP_REMOTEWEBVIEWAPI 一起注释掉
  readerwebview:
    image: hectorqin/remote-webview
    container_name: readerwebview
    restart: always
    environment:
      - TZ=Asia/Shanghai
